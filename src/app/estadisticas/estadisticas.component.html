<!-- Contenedor principal -->
<div class="container mt-4 estadisticas-container">
  <div class="card shadow-lg border-0 rounded-3">
    <div class="card-body">
      <h2 class="mb-4 text-secondary fw-bold">Panel de Estadísticas</h2>

      <!-- Fila 1: Socios inscritos + Ingresos -->
      <div class="row mb-4">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-primary text-white fw-bold">
              Socios inscritos por mes
            </div>
            <div class="card-body text-center">
              <div style="height:300px; width:100%;">
                <canvas id="graficaSocios"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-success text-white fw-bold">
              Ingresos por mes
            </div>
            <div class="card-body text-center">
              <div style="height:300px; width:100%;">
                <canvas id="graficaIngresos"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Fila 2: Morosos + Recurrentes -->
      <div class="row mb-4">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-warning fw-bold">
              Distribución de morosos
            </div>
            <div class="card-body text-center">
              <div style="height:300px; width:100%;">
                <canvas id="graficaMorosos"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-info text-white fw-bold">
              Recurrentes vs Nuevos socios
            </div>
            <div class="card-body text-center">
              <div style="height:300px; width:100%;">
                <canvas id="graficaRecurrentes"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
